<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="f-select(label, name, options)">
    <!-- select, option 정의 -->
    <div class="input-set">
        <label th:for="${name}" th:text="${label}">라벨명</label>
        <select class="form-select-sm" th:name="${name}" th:id="${name}">
            <!-- 동적 설정 -->
            <th:block th:if="${options != null and !#maps.isEmpty(options)}">
                <th:block th:each="opt : ${options}">
                    <option th:text="${opt.key}" th:value="${opt.value}">옵션</option>
                </th:block>
            </th:block>

            <th:block th:unless="${options != null and !#maps.isEmpty(options)}">
                <option value="">전체</option>
            </th:block>
        </select>
    </div>
</html>
