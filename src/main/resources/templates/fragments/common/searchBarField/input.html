<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="f-input(type, label, name, placeholder, required, readOnly)">
    <!-- 
        검색창 input 정의 
        type: 
            • text: 한 줄의 일반 텍스트 입력(기본값).
            • password: 입력 문자를 숨김 처리.
            • email: 이메일 형식 입력 및 기본 유효성 검사.
            • url: 웹 주소(URL) 입력.
            • tel: 전화번호 입력.
            • search: 검색어 입력 필드.

             • 숫자 및 범위
            • number: 숫자 입력(최소/최대값, 단계 지정 가능).
            • range: 슬라이더 형태의 범위 값 선택.

            • 날짜 및 시간
            • date: 연·월·일 선택.
            • datetime-local: 시간대 없는 날짜와 시간 선택.
            • month: 연·월 선택.
            • week: 연·주 선택.
            • time: 시·분(필요시 초) 선택.

             • 선택 및 파일
            • checkbox: 여러 항목 복수 선택.
            • radio: 같은 name 그룹 내 단일 선택.
            • file: 파일 업로드 선택(accept, multiple 속성 활용).
            • color: 색상 선택기.
     -->

    <!-- TODO: checkbox, radio 등의 멀티초이스 기능은 따로 커스텀 -->
    <div class="input-set">
        <label th:for="${name}" th:text="${label}">라벨명</label>
        <input 
        class="form-control-sm"
        th:type="${type}" 
        th:id="${name}" th:name="${name}" 
        th:placeholder="${placeholder}" 
        th:required="${required}"
        th:readOnly="${readOnly}"
        >
    </div>
</html>
