<!DOCTYPE html>
<!-- 레이아웃 적용 시 decorate 문 추가 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base1}">

    <!-- 페이지 조각명을 main 으로 명명해서 레이아웃과 맞춰준다 -->
    <th:block layout:fragment="main">
        <th:block th:replace="~{fragments/page/pgNav :: pgNav}"></th:block>
        <th:block th:replace="~{fragments/page/searchBar :: searchBar}"></th:block>
        <th:block th:replace="~{fragments/page/btnArea :: btnArea}"></th:block>
        <th:block th:replace="~{fragments/page/grid :: grid}"></th:block>
    </th:block>
</html>
